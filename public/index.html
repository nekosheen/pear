<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pear - Mistral Chat</title>
  <script src="../src/renderer/renderer.js"></script>
  <link href="../src/styles/main.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-8">Pear - Mistral Chat</h1>
    <div id="chat-container" class="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto">
      <div id="chat-messages" class="h-96 overflow-y-auto mb-4 border border-gray-200 rounded p-4"></div>
      <div class="flex gap-2">
        <input type="text" id="message-input" 
               class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
               placeholder="Type your message...">
        <button id="send-button" 
                class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          Send
        </button>
      </div>
    </div>
  </div>
</body>
</html>
