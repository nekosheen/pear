<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pear - Mistral Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mistral': {
              DEFAULT: '#6B46C1',
              light: '#9F7AEA',
              dark: '#4C1D95',
              50: '#F5F3FF',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../src/styles/main.css" rel="stylesheet">
  <script src="../dist/renderer/renderer.js" type="module" defer></script>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden" style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">

  <!-- Sidebar -->
  <div class="w-60 bg-gray-900 flex flex-col flex-shrink-0">

    <!-- Logo -->
    <div class="p-5 border-b border-gray-700">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🍐</span>
        <span class="text-white font-bold text-lg">Pear</span>
      </div>
      <p class="text-gray-500 text-xs mt-1 font-medium tracking-wide uppercase">Mistral AI</p>
    </div>

    <!-- Nav: New Chat + History -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="p-3 flex-shrink-0">
        <button id="new-chat-button" class="w-full text-left text-sm text-gray-400 hover:bg-gray-800 hover:text-gray-200 rounded-lg px-3 py-2.5 transition-colors duration-150 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New Chat
        </button>
      </div>

      <div id="conversation-list" class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5">
        <!-- Injected by renderer.ts -->
      </div>
    </div>

    <!-- User / Settings — clicking opens the Settings modal -->
    <button
      id="settings-button"
      class="p-4 border-t border-gray-800 w-full text-left hover:bg-gray-800 transition-colors duration-150 group"
      title="Settings"
    >
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-mistral flex items-center justify-center flex-shrink-0 group-hover:bg-mistral-dark transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-white">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-gray-200 text-sm font-medium truncate">You</p>
          <p class="text-gray-500 text-xs group-hover:text-gray-400 transition-colors">Click to open Settings</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-gray-600 group-hover:text-gray-400 flex-shrink-0 transition-colors">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.43.992a6.759 6.759 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
    </button>

  </div>

  <!-- Main Chat Area -->
  <div class="flex-1 flex flex-col bg-white min-w-0">

    <!-- Header — clean, no settings button here -->
    <div class="border-b border-gray-200 px-6 py-4 flex items-center bg-white">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-mistral flex items-center justify-center shadow-sm">
          <span class="text-white text-sm font-bold">M</span>
        </div>
        <div>
          <p class="font-semibold text-gray-900 text-sm">Mistral AI</p>
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span>
            <span class="text-emerald-600 text-xs font-medium">Online</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Messages -->
    <div id="chat-messages" class="flex-1 overflow-y-auto px-6 py-6 space-y-5">
      <!-- Messages injected by renderer.ts -->
    </div>

    <!-- Input Area -->
    <div class="border-t border-gray-100 px-6 py-4 bg-white">

      <!-- No-API-key notice (hidden when key is set) -->
      <div id="no-api-key-notice" class="no-api-key-notice">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 flex-shrink-0">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
        <span>Add your Mistral API key in <strong>Settings</strong> (your avatar, bottom left) to start chatting.</span>
      </div>

      <div class="flex items-center gap-3 bg-gray-50 rounded-2xl border border-gray-200 px-4 py-3 focus-within:border-mistral focus-within:ring-2 focus-within:ring-mistral-50 transition-all duration-200" id="input-wrapper">
        <input
          type="text"
          id="message-input"
          class="flex-1 bg-transparent focus:outline-none text-sm text-gray-900 placeholder-gray-400 min-w-0 disabled:cursor-not-allowed"
          placeholder="Message Mistral AI..."
          autocomplete="off"
        >
        <button
          id="send-button"
          class="p-2.5 bg-mistral text-white rounded-xl hover:bg-mistral-dark focus:outline-none focus:ring-2 focus:ring-mistral focus:ring-offset-1 transition-all duration-200 flex items-center justify-center flex-shrink-0 shadow-sm disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-mistral"
          title="Send"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
          </svg>
        </button>
      </div>
      <p class="text-xs text-gray-400 text-center mt-2.5">Mistral AI can make mistakes. Use with discretion.</p>
    </div>

  </div>
</body>
</html>
